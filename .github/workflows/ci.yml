name: Typescript CI

on:
  workflow_dispatch:
  push:
    branches: 
      - master 
      - lab1 
      - lab3
      - lab4
      - lab5
      - lab6
      - lab7
      - lab8-9
  pull_request: 
    branches: 
      - master 
      - lab1
      - lab3
      - lab4
      - lab5
      - lab6
      - lab7
      - lab8-9

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              run: |
                npm ci

